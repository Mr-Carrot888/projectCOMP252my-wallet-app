<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แดชบอร์ด - My Wallet</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="font-bold text-lg">💰 My Wallet</a>
      <div class="flex items-center gap-1 text-sm">
        <a href="/dashboard.html" class="px-3 py-2 rounded-lg font-semibold bg-indigo-700">แดชบอร์ด</a>
        <a href="/transactions.html" class="px-3 py-2 rounded-lg hover:bg-indigo-700">รายการ</a>
        <a href="/categories.html" class="px-3 py-2 rounded-lg hover:bg-indigo-700">หมวดหมู่</a>
        <a href="/profile.html" class="px-3 py-2 rounded-lg hover:bg-indigo-700">โปรไฟล์</a>
        <button onclick="logout()" class="ml-2 px-3 py-2 rounded-lg bg-indigo-800 hover:bg-indigo-900">ออกจากระบบ</button>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <!-- หัวเรื่อง + ชื่อผู้ใช้ -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">สวัสดี, <span id="nav-username">...</span> 👋</h1>
        <p class="text-slate-500 text-sm">นี่คือสรุปยอดเงินของคุณเดือนนี้</p>
      </div>
      <select id="period-select" onchange="loadAll()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
        <option value="current">เดือนนี้</option>
        <option value="prev">เดือนก่อน</option>
      </select>
    </div>

    <!-- การ์ดสรุป 3 ใบ -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-2xl shadow p-5">
        <p class="text-slate-500 text-sm">ยอดเงินคงเหลือสุทธิ</p>
        <p id="card-net" class="text-2xl font-bold text-slate-800 mt-1">0.00 บาท</p>
        <p class="text-xs text-slate-400 mt-1">รวมทุกกระเป๋า</p>
      </div>
      <div class="bg-emerald-50 rounded-2xl shadow p-5">
        <p class="text-emerald-600 text-sm">รวมรายรับเดือนนี้</p>
        <p id="card-income" class="text-2xl font-bold text-emerald-700 mt-1">0.00 บาท</p>
        <p id="card-month-label" class="text-xs text-emerald-400 mt-1"></p>
      </div>
      <div class="bg-rose-50 rounded-2xl shadow p-5">
        <p class="text-rose-600 text-sm">รวมรายจ่ายเดือนนี้</p>
        <p id="card-expense" class="text-2xl font-bold text-rose-700 mt-1">0.00 บาท</p>
        <p id="card-month-label2" class="text-xs text-rose-400 mt-1"></p>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="flex gap-3 mb-6">
      <button onclick="openTxModal('income')"
        class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-semibold hover:bg-emerald-700 transition-colors">
        + บันทึกรายรับ
      </button>
      <button onclick="openTxModal('expense')"
        class="flex-1 bg-rose-600 text-white py-3 rounded-xl font-semibold hover:bg-rose-700 transition-colors">
        + บันทึกรายจ่าย
      </button>
    </div>

    <!-- รายการล่าสุด -->
    <div class="bg-white rounded-2xl shadow p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-slate-800">รายการล่าสุด</h2>
        <a href="/transactions.html" class="text-indigo-600 text-sm font-semibold hover:underline">ดูทั้งหมด →</a>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="text-slate-500 border-b border-slate-200">
            <tr>
              <th class="py-2 px-2">วันที่</th>
              <th class="py-2 px-2">หมวดหมู่</th>
              <th class="py-2 px-2">บัญชี</th>
              <th class="py-2 px-2 text-right">จำนวนเงิน</th>
            </tr>
          </thead>
          <tbody id="recent-table">
            <tr><td colspan="4" class="py-4 text-center text-slate-400">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal บันทึกรายการ -->
  <div id="tx-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 id="tx-modal-title" class="font-bold text-lg text-slate-800">บันทึกรายการ</h3>
        <button onclick="closeModal('tx-modal')" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
      </div>
      <div id="tx-alert" class="hidden rounded-lg px-4 py-3 text-sm mb-4"></div>
      <form id="tx-form" class="space-y-3">
        <input type="hidden" id="tx-type" />
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">จำนวนเงิน (บาท)</label>
          <input id="tx-amount" type="number" step="0.01" min="0.01" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">หมวดหมู่</label>
          <select id="tx-category" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">บัญชีเงินเก็บ</label>
          <select id="tx-account" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">หมายเหตุ (ไม่บังคับ)</label>
          <input id="tx-note" type="text"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700">
          บันทึก
        </button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let categories = [];
    let accounts = [];

    // ---------- โหลดข้อมูลทั้งหมด ----------
    async function loadAll() {
      const prev = document.getElementById('period-select').value === 'prev';
      const now = new Date();
      let month = now.getMonth() + 1, year = now.getFullYear();
      if (prev) { month--; if (month === 0) { month = 12; year--; } }
      const thaiMonth = now.toLocaleString('th-TH', { month: 'long' });

      try {
        const [summary, txs, cats, accs] = await Promise.all([
          apiFetch(`/api/transactions/summary?month=${month}&year=${year}`),
          apiFetch('/api/transactions'),
          apiFetch('/api/categories'),
          apiFetch('/api/users/accounts')
        ]);

        // ใส่ค่าการ์ด
        document.getElementById('card-net').textContent = formatMoney(summary.net_balance) + ' บาท';
        document.getElementById('card-income').textContent = formatMoney(summary.total_income) + ' บาท';
        document.getElementById('card-expense').textContent = formatMoney(summary.total_expense) + ' บาท';
        document.getElementById('card-month-label').textContent = `ประจำเดือน ${thaiMonth} ${year}`;
        document.getElementById('card-month-label2').textContent = `ประจำเดือน ${thaiMonth} ${year}`;

        // รายการล่าสุด 8 รายการ
        const tbody = document.getElementById('recent-table');
        const recent = txs.slice(0, 8);
        if (recent.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-400">ยังไม่มีรายการ — เริ่มบันทึกรายรับแรกของคุณได้เลย!</td></tr>';
        } else {
          tbody.innerHTML = recent.map(t => `
            <tr class="border-b border-slate-100">
              <td class="py-2 px-2 text-slate-600">${formatDateTime(t.transaction_date)}</td>
              <td class="py-2 px-2">${t.category_name}</td>
              <td class="py-2 px-2 text-slate-500">${t.account_name}</td>
              <td class="py-2 px-2 text-right font-semibold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
                ${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}
              </td>
            </tr>`).join('');
        }

        categories = cats;
        accounts = accs;
      } catch (err) {
        console.error(err);
      }
    }

    // ---------- เปิด Modal บันทึกรายการ ----------
    function openTxModal(type) {
      document.getElementById('tx-type').value = type;
      document.getElementById('tx-modal-title').textContent = type === 'income' ? 'บันทึกรายรับ' : 'บันทึกรายจ่าย';

      // เติม dropdown หมวดหมู่ตามประเภท
      const catSelect = document.getElementById('tx-category');
      catSelect.innerHTML = categories
        .filter(c => c.type === type)
        .map(c => `<option value="${c.category_id}">${c.category_name}</option>`)
        .join('');

      // เติม dropdown บัญชี
      const accSelect = document.getElementById('tx-account');
      accSelect.innerHTML = accounts
        .map(a => `<option value="${a.account_id}">${a.account_name} (${formatMoney(a.balance)} บาท)</option>`)
        .join('');

      document.getElementById('tx-form').reset();
      document.getElementById('tx-type').value = type; // reset แล้วใส่ค่าใหม่
      document.getElementById('tx-alert').classList.add('hidden');
      openModal('tx-modal');
    }

    // ---------- ส่งฟอร์มบันทึกรายการ ----------
    document.getElementById('tx-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      try {
        await apiFetch('/api/transactions', {
          method: 'POST',
          body: {
            amount: document.getElementById('tx-amount').value,
            note: document.getElementById('tx-note').value,
            account_id: document.getElementById('tx-account').value,
            category_id: document.getElementById('tx-category').value,
            type: type
          }
        });
        closeModal('tx-modal');
        loadAll(); // โหลดใหม่เรียลไทม์
      } catch (err) {
        showAlert('tx-alert', err.message);
      }
    });

    // เริ่มต้น: เช็กล็อกอินแล้วโหลดข้อมูล
    requireLogin().then(loadAll);
  </script>
</body>
</html>

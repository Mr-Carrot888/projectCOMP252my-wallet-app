<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายรับ-รายจ่าย - My Wallet</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="font-bold text-lg">💰 My Wallet</a>
      <div class="flex items-center gap-1 text-sm">
        <a href="/dashboard.html" class="px-3 py-2 rounded-lg hover:bg-indigo-700">แดชบอร์ด</a>
        <a href="/transactions.html" class="px-3 py-2 rounded-lg font-semibold bg-indigo-700">รายการ</a>
        <a href="/categories.html" class="px-3 py-2 rounded-lg hover:bg-indigo-700">หมวดหมู่</a>
        <a href="/profile.html" class="px-3 py-2 rounded-lg hover:bg-indigo-700">โปรไฟล์</a>
        <button onclick="logout()" class="ml-2 px-3 py-2 rounded-lg bg-indigo-800 hover:bg-indigo-900">ออกจากระบบ</button>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-slate-800">รายรับ-รายจ่ายทั้งหมด</h1>
      <button onclick="openTxModal()"
        class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-indigo-700">+ เพิ่มรายการ</button>
    </div>

    <!-- ตัวกรอง -->
    <div class="bg-white rounded-2xl shadow p-4 mb-4 flex flex-wrap items-end gap-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">เดือน</label>
        <select id="filter-month" onchange="loadTransactions()"
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
          <option value="">ทุกเดือน</option>
          <option value="1">มกราคม</option><option value="2">กุมภาพันธ์</option>
          <option value="3">มีนาคม</option><option value="4">เมษายน</option>
          <option value="5">พฤษภาคม</option><option value="6">มิถุนายน</option>
          <option value="7">กรกฎาคม</option><option value="8">สิงหาคม</option>
          <option value="9">กันยายน</option><option value="10">ตุลาคม</option>
          <option value="11">พฤศจิกายน</option><option value="12">ธันวาคม</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">ปี</label>
        <select id="filter-year" onchange="loadTransactions()"
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"></select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">ประเภท</label>
        <select id="filter-type" onchange="loadTransactions()"
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
          <option value="">ทั้งหมด</option>
          <option value="income">รายรับ</option>
          <option value="expense">รายจ่าย</option>
        </select>
      </div>
      <div class="ml-auto text-sm text-slate-500">
        รวมทั้งหมด <span id="tx-count" class="font-bold text-slate-700">0</span> รายการ
      </div>
    </div>

    <!-- ตารางรายการ -->
    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="text-slate-500 bg-slate-50 border-b border-slate-200">
            <tr>
              <th class="py-3 px-4">วันที่</th>
              <th class="py-3 px-4">หมวดหมู่</th>
              <th class="py-3 px-4">ประเภท</th>
              <th class="py-3 px-4">บัญชี</th>
              <th class="py-3 px-4">หมายเหตุ</th>
              <th class="py-3 px-4 text-right">จำนวนเงิน</th>
              <th class="py-3 px-4 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="tx-table">
            <tr><td colspan="7" class="py-6 text-center text-slate-400">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal เพิ่ม/แก้ไขรายการ -->
  <div id="tx-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 id="tx-modal-title" class="font-bold text-lg text-slate-800">เพิ่มรายการ</h3>
        <button onclick="closeModal('tx-modal')" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
      </div>
      <div id="tx-alert" class="hidden rounded-lg px-4 py-3 text-sm mb-4"></div>
      <form id="tx-form" class="space-y-3">
        <input type="hidden" id="tx-id" />
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">ประเภท</label>
          <select id="tx-type" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white">
            <option value="income">รายรับ</option>
            <option value="expense">รายจ่าย</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">จำนวนเงิน (บาท)</label>
          <input id="tx-amount" type="number" step="0.01" min="0.01" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">หมวดหมู่</label>
          <select id="tx-category" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">บัญชีเงินเก็บ</label>
          <select id="tx-account" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">หมายเหตุ</label>
          <input id="tx-note" type="text"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700">
          บันทึก
        </button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let categories = [];
    let accounts = [];
    let lastTransactions = []; // เก็บรายการล่าสุดไว้ให้ปุ่มแก้ไขอ้างอิง

    // ---------- เติม dropdown ปี (5 ปีย้อนหลัง + ปีหน้า) ----------
    function fillYears() {
      const sel = document.getElementById('filter-year');
      const nowYear = new Date().getFullYear();
      let html = '<option value="">ทุกปี</option>';
      for (let y = nowYear + 1; y >= nowYear - 5; y--) {
        html += `<option value="${y}" ${y === nowYear ? 'selected' : ''}>${y}</option>`;
      }
      sel.innerHTML = html;
    }

    // ---------- โหลดรายการพร้อม filter ----------
    async function loadTransactions() {
      const month = document.getElementById('filter-month').value;
      const year = document.getElementById('filter-year').value;
      const type = document.getElementById('filter-type').value;

      const params = new URLSearchParams();
      if (month) params.set('month', month);
      if (year) params.set('year', year);
      if (type) params.set('type', type);

      try {
        const txs = await apiFetch('/api/transactions?' + params.toString());
        lastTransactions = txs;
        document.getElementById('tx-count').textContent = txs.length;

        const tbody = document.getElementById('tx-table');
        if (txs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-400">ไม่พบรายการ</td></tr>';
          return;
        }
        tbody.innerHTML = txs.map(t => `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="py-2.5 px-4 text-slate-600">${formatDateTime(t.transaction_date)}</td>
            <td class="py-2.5 px-4">${t.category_name}</td>
            <td class="py-2.5 px-4">
              <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${t.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                ${t.type === 'income' ? 'รายรับ' : 'รายจ่าย'}
              </span>
            </td>
            <td class="py-2.5 px-4 text-slate-500">${t.account_name}</td>
            <td class="py-2.5 px-4 text-slate-500">${t.note || '-'}</td>
            <td class="py-2.5 px-4 text-right font-semibold ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
              ${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}
            </td>
            <td class="py-2.5 px-4 text-center whitespace-nowrap">
              <button onclick="editTx(${t.transaction_id})"
                class="text-indigo-600 hover:underline text-xs font-semibold">แก้ไข</button>
              <span class="text-slate-300 mx-1">|</span>
              <button onclick="deleteTx(${t.transaction_id})"
                class="text-rose-600 hover:underline text-xs font-semibold">ลบ</button>
            </td>
          </tr>`).join('');
      } catch (err) {
        console.error(err);
      }
    }

    // ---------- เปิด Modal เพิ่มรายการ ----------
    async function openTxModal() {
      document.getElementById('tx-modal-title').textContent = 'เพิ่มรายการ';
      document.getElementById('tx-form').reset();
      document.getElementById('tx-id').value = '';
      fillTypeAndCategory();
      openModal('tx-modal');
    }

    // เติม dropdown หมวด (ตามประเภทที่เลือก) และบัญชี
    function fillTypeAndCategory(selectedCatId) {
      const type = document.getElementById('tx-type').value;
      const catSelect = document.getElementById('tx-category');
      catSelect.innerHTML = categories
        .filter(c => c.type === type)
        .map(c => `<option value="${c.category_id}">${c.category_name}</option>`)
        .join('');
      if (selectedCatId) catSelect.value = selectedCatId;

      const accSelect = document.getElementById('tx-account');
      accSelect.innerHTML = accounts
        .map(a => `<option value="${a.account_id}">${a.account_name} (${formatMoney(a.balance)} บาท)</option>`)
        .join('');
    }
    document.getElementById('tx-type').addEventListener('change', () => fillTypeAndCategory());

    // ---------- แก้ไขรายการ (หาข้อมูลจาก cache ก่อนแล้วค่อยเปิด modal) ----------
    function editTx(id) {
      const t = lastTransactions.find(x => x.transaction_id === id);
      if (!t) return;
      document.getElementById('tx-modal-title').textContent = 'แก้ไขรายการ';
      document.getElementById('tx-id').value = t.transaction_id;
      document.getElementById('tx-type').value = t.type;
      document.getElementById('tx-amount').value = parseFloat(t.amount);
      document.getElementById('tx-note').value = t.note || '';
      fillTypeAndCategory(t.category_id);
      document.getElementById('tx-account').value = t.account_id;
      document.getElementById('tx-alert').classList.add('hidden');
      openModal('tx-modal');
    }

    // ---------- ส่งฟอร์ม (เพิ่มหรือแก้ไข) ----------
    document.getElementById('tx-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('tx-id').value;
      const payload = {
        amount: document.getElementById('tx-amount').value,
        note: document.getElementById('tx-note').value,
        account_id: document.getElementById('tx-account').value,
        category_id: document.getElementById('tx-category').value,
        type: document.getElementById('tx-type').value
      };
      try {
        if (id) {
          await apiFetch('/api/transactions/' + id, { method: 'PUT', body: payload });
        } else {
          await apiFetch('/api/transactions', { method: 'POST', body: payload });
        }
        closeModal('tx-modal');
        loadTransactions(); // โหลดใหม่ทันที
      } catch (err) {
        showAlert('tx-alert', err.message);
      }
    });

    // ---------- ลบรายการ ----------
    async function deleteTx(id) {
      if (!confirm('ยืนยันการลบรายการนี้? ยอดเงินในบัญชีจะถูกคืนโดยอัตโนมัติ')) return;
      try {
        await apiFetch('/api/transactions/' + id, { method: 'DELETE' });
        loadTransactions(); // อัปเดตตารางทันที
      } catch (err) {
        alert(err.message);
      }
    }

    // เริ่มต้น
    (async () => {
      await requireLogin();
      [categories, accounts] = await Promise.all([
        apiFetch('/api/categories'),
        apiFetch('/api/users/accounts')
      ]);
      fillYears();
      loadTransactions();
    })();
  </script>
</body>
</html>
